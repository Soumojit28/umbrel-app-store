manifestVersion: 1
id: soumo-openalgo
name: OpenAlgo
tagline: Algorithmic trading platform for Indian brokers
# Community app stores load the icon from a URL. A local icon.svg file in
# this directory is never read by umbrelOS.
icon: https://raw.githubusercontent.com/Soumojit28/umbrel-app-store/main/soumo-openalgo/icon.svg
category: Finance
# Semver-shaped for umbrelOS. Upstream calls this release 2.0.2.0; the
# image is pinned by commit in docker-compose.yml.
version: "2.0.2"
port: 5000
description: >-
  OpenAlgo is a self-hosted algorithmic trading platform that puts a single
  unified API in front of 35+ Indian brokers.


  One instance gives you several surfaces sharing one broker session and one
  market-data feed:


  - Unified Broker API at /api/v1 for TradingView, Amibroker, ChartInk, Excel,
    Python and MCP clients

  - Python Strategy Host with an in-browser editor, IST scheduling and live logs

  - Flow, a no-code node graph builder from market data through indicators and
    conditions to order execution

  - Options and Portfolio Suite with 18 tools including Option Chain, Greeks,
    OI Tracker, Max Pain, Vol Surface, GEX, Portfolio Backtester and
    Strategy Builder

  - Charting and Scalping terminals for line-based and keyboard-driven trading


  A built-in Sandbox engine lets you paper trade against live data with
  1 Crore of virtual capital and exchange-aligned auto square-off before
  risking real money.


  Single user per deployment. Your broker credentials and trade data never
  leave your Umbrel.
developer: marketcalls
website: https://openalgo.in
submitter: Soumojit Ash
submission: https://github.com/marketcalls/openalgo
repo: https://github.com/marketcalls/openalgo
support: https://github.com/marketcalls/openalgo/issues
gallery: []
releaseNotes: >-
  Tracks OpenAlgo 2.0.2.0, pinned to image marketcalls/openalgo:2d8edfd.


  Installs and starts with no SSH required. A one-shot init service seeds the
  configuration file, generates fresh secrets, and sets the ownership the app
  needs before the main service starts.


  If you reach your Umbrel by IP rather than umbrel.local, set OA_HOSTNAME in
  docker-compose.yml before the first start, or run bootstrap-env.sh --force
  afterwards to rewrite the URLs.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
